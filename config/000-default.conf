<VirtualHost *:${PORT}>

	ServerAdmin admin@propeller.de
	DocumentRoot ${DOCUMENT_ROOT}

	<Directory ${DOCUMENT_ROOT}>
		# -MultiViews: content negotiation does a readdir() for every non-exact path (every storefront
		# route) on NFS and interferes with the mod_rewrite front controller (K2)
		Options -Indexes +FollowSymLinks -MultiViews
		# "All" keeps the Shopware public/.htaccess working. Set APACHE_ALLOW_OVERRIDE=None and ship the
		# rules via /etc/apache2/site.d/*.conf to drop the per-request lookups (K2).
		AllowOverride ${APACHE_ALLOW_OVERRIDE}
		Require all granted
	</Directory>

	# Media and thumbnails: static delivery only, no .htaccess lookups, no PHP execution (K2)
	<Directory ${DOCUMENT_ROOT}/media>
		AllowOverride None
		php_admin_flag engine off
	</Directory>
	<Directory ${DOCUMENT_ROOT}/thumbnail>
		AllowOverride None
		php_admin_flag engine off
	</Directory>

	# Per-site Apache rules mounted from a ConfigMap (replacement for .htaccess with APACHE_ALLOW_OVERRIDE=None)
	IncludeOptional /etc/apache2/site.d/*.conf

</VirtualHost>
